filter="url(#light)" style="animation:rise1 8.9s linear -2.9s infinite"/><circle cx="254" cy="133" r="1.3" fill="#8fd8e8" filter="url(#light)" style="animation:rise1 11.2s linear -0.6s infinite"/><circle cx="967" cy="452" r="2.1" fill="#8fd8e8" filter="url(#light)" style="animation:rise1 11.7s linear -5.8s infinite"/><circle cx="695" cy="477" r="2.1" fill="#f2bd5c" filter="url(#light)" style="animation:rise1 12.7s linear -8.2s infinite"/><circle cx="918" cy="415" r="1.6" fill="#8fd8e8" filter="url(#light)" style="animation:rise1 11.2s linear -2.1s infinite"/><text x="70" y="132" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="60" fill="#ece6da" text-anchor="start" font-weight="600" letter-spacing="-1" >RaftKV</text><text x="72" y="182" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="30" fill="#8fd8e8" text-anchor="start" font-weight="400" >Machines that agree.</text><text x="72" y="240.0" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="23" fill="#ece6da" text-anchor="start" font-weight="400" >A fault-tolerant key-value store on Raft,</text><text x="72" y="274.5" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="23" fill="#ece6da" text-anchor="start" font-weight="400" >written from scratch in Go.</text><text x="72" y="309.0" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="23" fill="#ece6da" text-anchor="start" font-weight="400" >Kill the leader: a new one is elected in</text><text x="72" y="343.5" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="23" fill="#ece6da" text-anchor="start" font-weight="400" >130–180 ms and no acknowledged write</text><text x="72" y="378.0" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="23" fill="#ece6da" text-anchor="start" font-weight="400" >is lost. Partition it: nothing splits.</text><text x="72" y="446" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="20" fill="#9aa3ad" text-anchor="start" font-weight="400" >Group commit: 3× throughput, 4.5× lower p99</text><path d="M634,474 L639,338 L661,338 L666,474 Z" fill="#15282f"/><rect x="630" y="332" width="40" height="9" fill="#15282f"/><text x="650" y="460" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="19" fill="#9aa3ad" text-anchor="middle" font-weight="400" >node 1</text><path d="M754,474 L759,238 L781,238 L786,474 Z" fill="#15282f"/><rect x="750" y="232" width="40" height="9" fill="#15282f"/><text x="770" y="460" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="19" fill="#9aa3ad" text-anchor="middle" font-weight="400" >node 2</text><path d="M889,474 L894,198 L916,198 L921,474 Z" fill="#15282f"/><rect x="885" y="192" width="40" height="9" fill="#15282f"/><text x="905" y="460" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="19" fill="#9aa3ad" text-anchor="middle" font-weight="400" >node 3</text><path d="M1024,474 L1029,238 L1051,238 L1056,474 Z" fill="#15282f"/><rect x="1020" y="232" width="40" height="9" fill="#15282f"/><text x="1040" y="460" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="19" fill="#9aa3ad" text-anchor="middle" font-weight="400" >node 4</text><path d="M1104,474 L1109,348 L1131,348 L1136,474 Z" fill="#15282f"/><rect x="1100" y="342" width="40" height="9" fill="#15282f"/><text x="1120" y="460" font-fam