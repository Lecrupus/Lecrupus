><g class="T" style="animation-name:cap1"><text x="885" y="96" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="22" fill="#ece6da" text-anchor="middle" font-weight="400" >Node 1 leads term 7 and sends heartbeats</text></g><g class="T" style="animation-name:cap2"><text x="885" y="96" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="22" fill="#ef7d55" text-anchor="middle" font-weight="400" >Node 1 is down. Node 3 asks for votes</text></g><g class="T" style="animation-name:cap3"><text x="885" y="96" font-family="'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','TeX Gyre Pagella',Georgia,serif" font-size="22" fill="#f2bd5c" text-anchor="middle" font-weight="400" >Node 3 wins term 8. No write was lost</text></g></svg>
