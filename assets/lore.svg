<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Lore: who Suryansh is"><title>Lore: who Suryansh is</title><defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="9"/>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 .6  0 0 0 0 .7  0 0 0 0 .9  0 0 0 .05 0"/>
</filter>
<radialGradient id="lanternlight"><stop offset="0" stop-color="#f4c76e" stop-opacity=".55"/>
  <stop offset="1" stop-color="#f4c76e" stop-opacity="0"/></radialGradient>
<radialGradient id="soullight"><stop offset="0" stop-color="#a6ecff" stop-opacity=".5"/>
  <stop offset="1" stop-color="#a6ecff" stop-opacity="0"/></radialGradient>
<style>
@keyframes rise1{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(18px,-260px);opacity:0}}
@keyframes rise2{0%{transform:translate(0,0);opacity:0}20%{opacity:.7}100%{transform:translate(-22px,-300px);opacity:0}}
@keyframes rise3{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}100%{transform:translate(6px,-220px);opacity:0}}
@keyframes flicker{0%,100%{opacity:.85}12%{opacity:.6}20%{opacity:.95}48%{opacity:.7}60%{opacity:1}80%{opacity:.75}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}
@keyframes eyes{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-1200px)}}
.fl{animation:flicker 3.2s infinite}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sway 6s ease-in-out infinite}
.pu{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
.bl{animation:blink 2.4s infinite}
.ey{transform-box:fill-box;transform-origin:center;animation:eyes 5s infinite}
</style></defs><rect x=".5" y=".5" width="1199" height="199" rx="14" fill="#080d1a" stroke="#17213a"/><circle cx="211" cy="157" r="1.5" fill="#a6ecff" filter="url(#glow)" style="animation:rise2 11.3s linear -9.1s infinite"/><circle cx="614" cy="131" r="1.2" fill="#a6ecff" filter="url(#glow)" style="animation:rise2 14.1s linear -13.1s infinite"/><circle cx="517" cy="80" r="1.2" fill="#a6ecff" filter="url(#glow)" style="animation:rise2 15.3s linear -15.3s infinite"/><circle cx="877" cy="183" r="2.4" fill="#e9eef6" filter="url(#glow)" style="animation:rise3 11.0s linear -5.5s infinite"/><circle cx="154" cy="193" r="1.5" fill="#a6ecff" filter="url(#glow)" style="animation:rise1 7.2s linear -5.8s infinite"/><circle cx="43" cy="83" r="1.5" fill="#a6ecff" filter="url(#glow)" style="animation:rise1 10.6s linear -7.1s infinite"/><circle cx="565" cy="175" r="1" fill="#a6ecff" filter="url(#glow)" style="animation:rise3 14.0s linear -13.6s infinite"/><circle cx="1057" cy="166" r="2.4" fill="#a6ecff" filter="url(#glow)" style="animation:rise1 15.9s linear -8.9s infinite"/><circle cx="668" cy="114" r="1.5" fill="#f4c76e" filter="url(#glow)" style="animation:rise2 15.3s linear -5.6s infinite"/><circle cx="544" cy="114" r="1.8" fill="#a6ecff" filter="url(#glow)" style="animation:rise1 10.5s linear -1.7s infinite"/><circle cx="851" cy="198" r="1" fill="#a6ecff" filter="url(#glow)" style="animation:rise3 11.4s linear -7.0s infinite"/><circle cx="666" cy="147" r="1.2" fill="#e9eef6" filter="url(#glow)" style="animation:rise2 13.0s linear -4.5s infinite"/><circle cx="713" cy="103" r="1" fill="#a6ecff" filter="url(#glow)" style="animation:rise2 8.5s linear -3.2s infinite"/><circle cx="813" cy="155" r="1.2" fill="#a6ecff" filter="url(#glow)" style="animation:rise3 10.7s linear -6.3s infinite"/><text x="600.0" y="62" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="21" fill="#cfd8e8" text-anchor="middle" font-weight="400" letter-spacing="0" font-style="italic">Beneath the surface lies a kingdom of half-built engines and long nights.</text><text x="600.0" y="96" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="21" fill="#cfd8e8" text-anchor="middle" font-weight="400" letter-spacing="0" font-style="italic">Its wanderer trains models, teaches machines to agree, and sends small agents</text><text x="600.0" y="130" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="21" fill="#cfd8e8" text-anchor="middle" font-weight="400" letter-spacing="0" font-style="italic">down into the dark to trade, remember and report back.</text><text x="600.0" y="172" font-family="'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="13" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="3" >— inscription found at the entrance</text></svg>
