<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Footer: progress saved"><title>Footer: progress saved</title><defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="9"/>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 .6  0 0 0 0 .7  0 0 0 0 .9  0 0 0 .05 0"/>
</filter>
<radialGradient id="lanternlight"><stop offset="0" stop-color="#f4c76e" stop-opacity=".55"/>
  <stop offset="1" stop-color="#f4c76e" stop-opacity="0"/></radialGradient>
<radialGradient id="soullight"><stop offset="0" stop-color="#a6ecff" stop-opacity=".5"/>
  <stop offset="1" stop-color="#a6ecff" stop-opacity="0"/></radialGradient>
<style>
@keyframes rise1{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(18px,-260px);opacity:0}}
@keyframes rise2{0%{transform:translate(0,0);opacity:0}20%{opacity:.7}100%{transform:translate(-22px,-300px);opacity:0}}
@keyframes rise3{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}100%{transform:translate(6px,-220px);opacity:0}}
@keyframes flicker{0%,100%{opacity:.85}12%{opacity:.6}20%{opacity:.95}48%{opacity:.7}60%{opacity:1}80%{opacity:.75}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}
@keyframes eyes{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-1200px)}}
.fl{animation:flicker 3.2s infinite}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sway 6s ease-in-out infinite}
.pu{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
.bl{animation:blink 2.4s infinite}
.ey{transform-box:fill-box;transform-origin:center;animation:eyes 5s infinite}
</style></defs><rect width="1200" height="260" rx="14" fill="#04060c"/><path d="M0,2000 L0,222 L42,225 L82,224 L113,226 L151,221 L188,223 L213,225 L241,224 L288,220 L326,208 L353,226 L375,227 L406,218 L438,216 L460,210 L497,213 L529,226 L560,208 L598,224 L645,226 L675,226 L716,219 L749,219 L789,226 L826,225 L852,222 L884,225 L911,215 L935,218 L972,210 L996,226 L1030,218 L1057,219 L1093,221 L1128,223 L1152,224 L1198,221 L1200,2000 Z" fill="#0a1022"/><path d="M520,226 q80,-26 160,0 Z" fill="#0e1527" stroke="#2a3858"/>
<g transform="translate(600,196) scale(1.1)">
  <circle cx="26" cy="-46" r="70" fill="url(#lanternlight)" class="fl"/>
  <path d="M0,-40 C-15,-37 -21,-8 -23,20 L-28,31 L-8,27 L0,32 L9,27 L28,31 L23,20 C21,-8 15,-37 0,-40 Z" fill="#0b1122" stroke="#2a3858" stroke-width="1.2"/>
  <path d="M-14,-27 C-15,-52 15,-52 14,-27 C13,-15 -13,-15 -14,-27 Z" fill="#111a31" stroke="#2a3858" stroke-width="1.2"/>
  <ellipse cx="0" cy="-26" rx="8.5" ry="7.5" fill="#010208"/>
  <g class="ey"><ellipse cx="-3.6" cy="-27" rx="1.7" ry="2.3" fill="#a6ecff" filter="url(#glow)"/>
  <ellipse cx="3.6" cy="-27" rx="1.7" ry="2.3" fill="#a6ecff" filter="url(#glow)"/></g>
  <line x1="17" y1="31" x2="23" y2="-56" stroke="#4a3a2a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M23,-56 q8,-2 9,6" fill="none" stroke="#4a3a2a" stroke-width="2"/>
  <g class="sw" style="transform-origin:32px -50px">
    <line x1="32" y1="-50" x2="32" y2="-44" stroke="#8a9bb8" stroke-width="1"/>
    <path d="M27,-44 h10 l-1.5,12 h-7 Z" fill="#f4c76e" opacity=".9" class="fl" filter="url(#glow)"/>
    <path d="M26,-44 h12 M27,-32 h10" stroke="#5b4630" stroke-width="1.6"/>
  </g>
</g><circle cx="530" cy="192" r="1" fill="#f4c76e" filter="url(#glow)" style="animation:rise1 9.4s linear -2.5s infinite"/><circle cx="480" cy="90" r="1.2" fill="#a6ecff" filter="url(#glow)" style="animation:rise3 11.5s linear -4.2s infinite"/><circle cx="726" cy="217" r="1.5" fill="#f4c76e" filter="url(#glow)" style="animation:rise2 12.8s linear -7.8s infinite"/><circle cx="555" cy="185" r="1.2" fill="#f4c76e" filter="url(#glow)" style="animation:rise2 9.9s linear -9.4s infinite"/><circle cx="792" cy="200" r="1.2" fill="#f4c76e" filter="url(#glow)" style="animation:rise1 12.4s linear -10.0s infinite"/><circle cx="749" cy="144" r="2.4" fill="#f4c76e" filter="url(#glow)" style="animation:rise1 7.2s linear -2.8s infinite"/><circle cx="428" cy="125" r="1.5" fill="#f4c76e" filter="url(#glow)" style="animation:rise2 8.3s linear -6.4s infinite"/><circle cx="638" cy="144" r="1" fill="#a6ecff" filter="url(#glow)" style="animation:rise1 8.8s linear -1.4s infinite"/><circle cx="577" cy="178" r="1.5" fill="#a6ecff" filter="url(#glow)" style="animation:rise3 7.9s linear -6.0s infinite"/><circle cx="503" cy="214" r="1" fill="#f4c76e" filter="url(#glow)" style="animation:rise1 7.3s linear -3.5s infinite"/><circle cx="680" cy="171" r="2.4" fill="#f4c76e" filter="url(#glow)" style="animation:rise2 14.8s linear -12.9s infinite"/><circle cx="793" cy="170" r="1.8" fill="#a6ecff" filter="url(#glow)" style="animation:rise1 9.1s linear -1.9s infinite"/><circle cx="650" cy="130" r="1.8" fill="#f4c76e" filter="url(#glow)" style="animation:rise2 10.8s linear -4.1s infinite"/><circle cx="688" cy="192" r="2.4" fill="#f4c76e" filter="url(#glow)" style="animation:rise1 14.8s linear -14.3s infinite"/><circle cx="563" cy="162" r="2.4" fill="#a6ecff" filter="url(#glow)" style="animation:rise2 11.5s linear -7.9s infinite"/><circle cx="420" cy="157" r="1.5" fill="#a6ecff" filter="url(#glow)" style="animation:rise3 9.2s linear -1.4s infinite"/><circle cx="579" cy="183" r="1.5" fill="#f4c76e" filter="url(#glow)" style="animation:rise2 12.3s linear -4.7s infinite"/><circle cx="627" cy="212" r="1.5" fill="#a6ecff" filter="url(#glow)" style="animation:rise3 9.8s linear -5.2s infinite"/><circle cx="524" cy="233" r="1" fill="#f4c76e" filter="url(#glow)" style="animation:rise2 14.5s linear -5.9s infinite"/><circle cx="748" cy="145" r="2.4" fill="#f4c76e" filter="url(#glow)" style="animation:rise3 7.9s linear -3.7s infinite"/><circle cx="698" cy="126" r="1.2" fill="#a6ecff" filter="url(#glow)" style="animation:rise3 11.3s linear -9.1s infinite"/><circle cx="575" cy="113" r="1.8" fill="#a6ecff" filter="url(#glow)" style="animation:rise1 11.1s linear -0.7s infinite"/><circle cx="431" cy="244" r="1.8" fill="#a6ecff" filter="url(#glow)" style="animation:rise1 9.1s linear -1.7s infinite"/><circle cx="581" cy="83" r="1.2" fill="#a6ecff" filter="url(#glow)" style="animation:rise1 7.1s linear -0.9s infinite"/><text x="600.0" y="60" font-family="'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="18" fill="#e9eef6" text-anchor="middle" font-weight="400" letter-spacing="5" >YOU REST BY THE LANTERN.  PROGRESS SAVED.</text><g class="bl"><text x="600.0" y="92" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="15" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" font-style="italic">thank you for exploring</text></g><rect x=".5" y=".5" width="1199" height="259" rx="14" fill="none" stroke="#17213a"/></svg>
