<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Agentic Trading Desk project card"><title>Agentic Trading Desk project card</title><defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="9"/>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 .6  0 0 0 0 .7  0 0 0 0 .9  0 0 0 .05 0"/>
</filter>
<radialGradient id="lanternlight"><stop offset="0" stop-color="#f4c76e" stop-opacity=".55"/>
  <stop offset="1" stop-color="#f4c76e" stop-opacity="0"/></radialGradient>
<radialGradient id="soullight"><stop offset="0" stop-color="#a6ecff" stop-opacity=".5"/>
  <stop offset="1" stop-color="#a6ecff" stop-opacity="0"/></radialGradient>
<style>
@keyframes rise1{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(18px,-260px);opacity:0}}
@keyframes rise2{0%{transform:translate(0,0);opacity:0}20%{opacity:.7}100%{transform:translate(-22px,-300px);opacity:0}}
@keyframes rise3{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}100%{transform:translate(6px,-220px);opacity:0}}
@keyframes flicker{0%,100%{opacity:.85}12%{opacity:.6}20%{opacity:.95}48%{opacity:.7}60%{opacity:1}80%{opacity:.75}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}
@keyframes eyes{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-1200px)}}
.fl{animation:flicker 3.2s infinite}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sway 6s ease-in-out infinite}
.pu{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
.bl{animation:blink 2.4s infinite}
.ey{transform-box:fill-box;transform-origin:center;animation:eyes 5s infinite}
</style><linearGradient id="cardbg" x1="0" x2="1"><stop offset="0" stop-color="#0e1527"/>
  <stop offset="1" stop-color="#080d1a"/></linearGradient></defs><rect x=".5" y=".5" width="1199" height="249" rx="14" fill="url(#cardbg)" stroke="#17213a"/><rect x="0" y="0" width="5" height="250" rx="2" fill="#79c99b" opacity=".8"/><circle cx="1060" cy="125.0" r="150" fill="#79c99b" opacity=".05"/><text x="44" y="46" font-family="'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="13" fill="#79c99b" text-anchor="start" font-weight="400" letter-spacing="4" >AREA DISCOVERED  ·  THE TRADING HALLS</text><text x="44" y="92" font-family="'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="38" fill="#e9eef6" text-anchor="start" font-weight="600" letter-spacing="2" >Agentic Trading Desk</text><text x="44" y="128" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="17" fill="#c3cee0" text-anchor="start" font-weight="400" letter-spacing="0" >An orchestrator delegates to analyst, risk and execution agents that trade on</text><text x="44" y="153" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="17" fill="#c3cee0" text-anchor="start" font-weight="400" letter-spacing="0" >a C++ order-book simulator exposed as an MCP server. Every order passes hard</text><text x="44" y="178" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="17" fill="#c3cee0" text-anchor="start" font-weight="400" letter-spacing="0" >risk limits; an eval harness scores PnL, breaches and failed tool calls in CI.</text><rect x="44" y="206" width="157" height="26" rx="13" fill="none" stroke="#2a3858"/><text x="122.6" y="224" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="14" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" >Claude Agent SDK</text><rect x="211.2" y="206" width="51" height="26" rx="13" fill="none" stroke="#2a3858"/><text x="236.5" y="224" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="14" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" >MCP</text><rect x="271.79999999999995" y="206" width="51" height="26" rx="13" fill="none" stroke="#2a3858"/><text x="297.09999999999997" y="224" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="14" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" >C++</text><rect x="332.4" y="206" width="75" height="26" rx="13" fill="none" stroke="#2a3858"/><text x="370.0" y="224" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="14" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" >Docker</text><rect x="417.59999999999997" y="206" width="124" height="26" rx="13" fill="none" stroke="#2a3858"/><text x="479.79999999999995" y="224" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="14" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" >eval harness</text><circle cx="1050" cy="88" r="42" fill="none" stroke="#79c99b" stroke-opacity=".4"/><circle cx="1050" cy="88" r="52" fill="none" stroke="#79c99b" stroke-opacity=".15" stroke-dasharray="2 6"/><text x="1050" y="98" font-family="'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="22" fill="#79c99b" text-anchor="middle" font-weight="600" letter-spacing="0" filter="url(#glow)">3,540</text><text x="1050" y="166" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="15" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" font-style="italic">real orders replayed</text><circle cx="1016" cy="219" r="4" fill="#79c99b" class="bl"/><text x="1028" y="224" font-family="'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="12" fill="#e9eef6" text-anchor="start" font-weight="400" letter-spacing="2" >LIVE DEMO  ·  ENTER  →</text><circle cx="1000" cy="60" r="2.4" fill="#79c99b" filter="url(#glow)" style="animation:rise3 14.7s linear -4.1s infinite"/><circle cx="974" cy="187" r="2.4" fill="#79c99b" filter="url(#glow)" style="animation:rise3 9.3s linear -9.0s infinite"/><circle cx="1123" cy="98" r="2.4" fill="#79c99b" filter="url(#glow)" style="animation:rise1 7.1s linear -1.2s infinite"/><circle cx="977" cy="81" r="1.2" fill="#e9eef6" filter="url(#glow)" style="animation:rise2 11.3s linear -1.8s infinite"/><circle cx="1008" cy="178" r="1.2" fill="#79c99b" filter="url(#glow)" style="animation:rise1 15.6s linear -0.9s infinite"/><circle cx="1149" cy="197" r="1" fill="#e9eef6" filter="url(#glow)" style="animation:rise1 12.3s linear -5.2s infinite"/><circle cx="960" cy="77" r="1" fill="#e9eef6" filter="url(#glow)" style="animation:rise2 14.5s linear -12.9s infinite"/><circle cx="1129" cy="113" r="1.2" fill="#e9eef6" filter="url(#glow)" style="animation:rise1 15.6s linear -14.9s infinite"/></svg>
