<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Hivemind project card"><title>Hivemind project card</title><defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="9"/>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix" values="0 0 0 0 .6  0 0 0 0 .7  0 0 0 0 .9  0 0 0 .05 0"/>
</filter>
<radialGradient id="lanternlight"><stop offset="0" stop-color="#f4c76e" stop-opacity=".55"/>
  <stop offset="1" stop-color="#f4c76e" stop-opacity="0"/></radialGradient>
<radialGradient id="soullight"><stop offset="0" stop-color="#a6ecff" stop-opacity=".5"/>
  <stop offset="1" stop-color="#a6ecff" stop-opacity="0"/></radialGradient>
<style>
@keyframes rise1{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(18px,-260px);opacity:0}}
@keyframes rise2{0%{transform:translate(0,0);opacity:0}20%{opacity:.7}100%{transform:translate(-22px,-300px);opacity:0}}
@keyframes rise3{0%{transform:translate(0,0);opacity:0}10%{opacity:.8}100%{transform:translate(6px,-220px);opacity:0}}
@keyframes flicker{0%,100%{opacity:.85}12%{opacity:.6}20%{opacity:.95}48%{opacity:.7}60%{opacity:1}80%{opacity:.75}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}
@keyframes eyes{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-1200px)}}
.fl{animation:flicker 3.2s infinite}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sway 6s ease-in-out infinite}
.pu{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
.bl{animation:blink 2.4s infinite}
.ey{transform-box:fill-box;transform-origin:center;animation:eyes 5s infinite}
</style><linearGradient id="cardbg" x1="0" x2="1"><stop offset="0" stop-color="#0e1527"/>
  <stop offset="1" stop-color="#080d1a"/></linearGradient></defs><rect x=".5" y=".5" width="1199" height="249" rx="14" fill="url(#cardbg)" stroke="#17213a"/><rect x="0" y="0" width="5" height="250" rx="2" fill="#f4c76e" opacity=".8"/><circle cx="1060" cy="125.0" r="150" fill="#f4c76e" opacity=".05"/><text x="44" y="46" font-family="'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="13" fill="#f4c76e" text-anchor="start" font-weight="400" letter-spacing="4" >AREA DISCOVERED  ·  THE HIVE ARCHIVE</text><text x="44" y="92" font-family="'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="38" fill="#e9eef6" text-anchor="start" font-weight="600" letter-spacing="2" >Hivemind</text><text x="44" y="128" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="17" fill="#c3cee0" text-anchor="start" font-weight="400" letter-spacing="0" >Shared, time-aware graph memory for teams of AI coding agents (Claude Code,</text><text x="44" y="153" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="17" fill="#c3cee0" text-anchor="start" font-weight="400" letter-spacing="0" >Cursor, Codex) on FalkorDB. Agents learn procedures by watching each other,</text><text x="44" y="178" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="17" fill="#c3cee0" text-anchor="start" font-weight="400" letter-spacing="0" >see who is editing what, and never make the same mistake twice.</text><rect x="44" y="206" width="75" height="26" rx="13" fill="none" stroke="#2a3858"/><text x="81.6" y="224" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="14" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" >Python</text><rect x="129.2" y="206" width="92" height="26" rx="13" fill="none" stroke="#2a3858"/><text x="175.0" y="224" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="14" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" >FalkorDB</text><rect x="230.79999999999998" y="206" width="51" height="26" rx="13" fill="none" stroke="#2a3858"/><text x="256.09999999999997" y="224" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="14" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" >MCP</text><rect x="291.4" y="206" width="165" height="26" rx="13" fill="none" stroke="#2a3858"/><text x="374.09999999999997" y="224" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="14" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" >Claude Code hooks</text><rect x="466.79999999999995" y="206" width="116" height="26" rx="13" fill="none" stroke="#2a3858"/><text x="524.9" y="224" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="14" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" >Graph Hacks</text><circle cx="1050" cy="88" r="42" fill="none" stroke="#f4c76e" stroke-opacity=".4"/><circle cx="1050" cy="88" r="52" fill="none" stroke="#f4c76e" stroke-opacity=".15" stroke-dasharray="2 6"/><text x="1050" y="98" font-family="'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="28" fill="#f4c76e" text-anchor="middle" font-weight="600" letter-spacing="0" filter="url(#glow)">1×</text><text x="1050" y="166" font-family="'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="15" fill="#8a9bb8" text-anchor="middle" font-weight="400" letter-spacing="0" font-style="italic">every mistake, made only once</text><circle cx="1016" cy="219" r="4" fill="#79c99b" class="bl"/><text x="1028" y="224" font-family="'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif" font-size="12" fill="#e9eef6" text-anchor="start" font-weight="400" letter-spacing="2" >LIVE DEMO  ·  ENTER  →</text><circle cx="1053" cy="151" r="1.8" fill="#f4c76e" filter="url(#glow)" style="animation:rise2 11.5s linear -8.0s infinite"/><circle cx="930" cy="145" r="1.2" fill="#f4c76e" filter="url(#glow)" style="animation:rise1 16.0s linear -3.1s infinite"/><circle cx="1170" cy="205" r="2.4" fill="#e9eef6" filter="url(#glow)" style="animation:rise3 10.2s linear -8.0s infinite"/><circle cx="902" cy="200" r="1.5" fill="#f4c76e" filter="url(#glow)" style="animation:rise3 11.9s linear -9.4s infinite"/><circle cx="934" cy="226" r="1.5" fill="#f4c76e" filter="url(#glow)" style="animation:rise2 11.6s linear -3.0s infinite"/><circle cx="1142" cy="180" r="1.5" fill="#e9eef6" filter="url(#glow)" style="animation:rise1 12.2s linear -8.7s infinite"/><circle cx="1118" cy="163" r="2.4" fill="#f4c76e" filter="url(#glow)" style="animation:rise1 14.4s linear -7.8s infinite"/><circle cx="1055" cy="160" r="1.2" fill="#e9eef6" filter="url(#glow)" style="animation:rise2 11.6s linear -7.7s infinite"/></svg>
